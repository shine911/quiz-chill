<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2447e5" />
    <title>QuizChill — Trắc nghiệm JSON, Nhạc Chill & TTS</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141413'/%3E%3Crect x='11' y='11' width='19' height='19' rx='4' fill='%23D9385A'/%3E%3Crect x='34' y='11' width='19' height='19' rx='4' fill='%230E7AE6'/%3E%3Crect x='11' y='34' width='19' height='19' rx='4' fill='%23D9820B'/%3E%3Crect x='34' y='34' width='19' height='19' rx='4' fill='%23168A5B'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('quizchill:prefs');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F7F5] text-[#141413] dark:bg-[#121417] dark:text-[#F3F4F6] antialiased selection:bg-[#2447E5]/15 selection:text-[#2447E5] dark:selection:bg-[#4F75FF]/25 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
